<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test Page</title>
</head>
<body>
  <header>
    <h1>Welcome to the Test Page</h1>
  </header>
  <main>
    <section contenteditable="true" id="editor">
      <p>Normal <em>italic and unwrapped</em> text.</p>
      <p>Here is a paragraph.</p>
      <p>Here is another paragraph.</p>
      <p>Here we already have <strong>some bold</strong>.</p>
    </section>
    <nav>
      <button onclick="toggle('em')">Italic</button>
      <button onclick="toggle('strong')">Bold</button>
    </nav>
  </main>
  <footer>
    <p>Test Page Footer</p>
  </footer>
  <script>
console.log("This is a test script.");  
// Additional JavaScript can be added here

const zws = '\u200B';

const editor = document.querySelector('#editor');

editor.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowLeft') skipZWS('backward');
  if (e.key === 'ArrowRight') skipZWS('forward');
  if (e.key === 'Backspace') {
    console.log('backspace');
    const sel = window.getSelection();
    if (!sel.rangeCount) return;

    const range = sel.getRangeAt(0);
    if (!range.collapsed) return;

    const { startContainer, startOffset } = range;
    if (startContainer.nodeType !== Node.TEXT_NODE) return;

    const text = startContainer.nodeValue;
    if (startOffset === 0) return; // nothing to backspace

    if (text[startOffset - 1] === '\u200B') {
      // Remove ZWS manually
      const updated = text.slice(0, startOffset - 1) + text.slice(startOffset);
      startContainer.nodeValue = updated;

      // Move caret back by 1
      const newOffset = startOffset - 1;
      const newRange = document.createRange();
      newRange.setStart(startContainer, newOffset);
      newRange.setEnd(startContainer, newOffset);
      sel.removeAllRanges();
      sel.addRange(newRange);
    // Now the default behavior will advance over a non-ZWS character as expected
    }
    return;
  }
});

function toggle(tagname) {
  preserveSelectionByCharacterOffset(editor, () => {
    console.log('in my function');
    const selection = window.getSelection();
    if (selection.rangeCount > 0) {
      const range = selection.getRangeAt(0);
      console.log('doing my work');
      return toggleInlineTag(range, tagname);
    }
  });
}

function toggleInlineTag(range, tagName) {
  if (!range) {
    return;
  }

  const textNodes = collectTextNodes(range);
  const allInside = [...textNodes].every(node => isInsideTag(node, tagName));

  if (allInside) {
    if (range.collapsed) {
      return;
    }
    return unwrapTagInRange(range, textNodes, tagName);
  } else {
    return wrapRangeInTag(range, tagName);
  }
}

function wrapRangeInTag(range, tagName) {

  // If there is no selection yet, make sure the caret is inside
  // a suitable tag so the next keystroke produces the expected effect
  // (e.g. press control-b, start typing, get bold)
  if (range.collapsed) {
    console.log('collapsed');
    // Check if caret is already inside tag
    if (isInsideTag(range.startContainer, tagName)) {
      console.log('already set');
      return; // already bold, do nothing here (or unwrap if desired)
    }

    const wrapper = document.createElement(tagName);
    const zws = document.createTextNode('\u200B');
    wrapper.appendChild(zws);
    range.insertNode(wrapper);

    // Move caret inside the wrapper
    range.setStart(zws, 1);
    range.setEnd(zws, 1);

    const sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
    // Do not try to restore the selection, we've finessed it already
    console.log('returning false');
    return false;
  }

  const textNodes = collectTextNodes(range);

  for (const textNode of textNodes) {
    if (isInsideTag(textNode, tagName)) continue;

    let startOffset = 0;
    let endOffset = textNode.length;

    if (textNode === range.startContainer) startOffset = range.startOffset;
    if (textNode === range.endContainer) endOffset = range.endOffset;
    if (startOffset >= endOffset) continue;

    let middle = textNode;

    if (endOffset < middle.length) {
      middle.splitText(endOffset);
    }

    if (startOffset > 0) {
      middle = middle.splitText(startOffset);
    }

    const wrapper = document.createElement(tagName);
    wrapper.textContent = middle.textContent;
    middle.parentNode.replaceChild(wrapper, middle);

    // Forward merge: wrapper <tag> + <tag>
    const next = wrapper.nextSibling;
    if (
      next &&
      next.nodeType === Node.ELEMENT_NODE &&
      next.tagName === tagName.toUpperCase()
    ) {
      while (next.firstChild) wrapper.appendChild(next.firstChild);
      next.remove();
    }

    // Backward merge: <tag> + wrapper
    const prev = wrapper.previousSibling;
    if (
      prev &&
      prev.nodeType === Node.ELEMENT_NODE &&
      prev.tagName === tagName.toUpperCase()
    ) {
      while (wrapper.firstChild) prev.appendChild(wrapper.firstChild);
      wrapper.remove();
    }
  }

  normalizeRangeContainer(range);
}

function unwrapTagInRange(range, textNodes, tagName) {
  tagName = tagName.toUpperCase();

  const seen = new Set();

  for (const textNode of textNodes) {
    // Avoid processing the same node twice
    if (seen.has(textNode)) continue;
    seen.add(textNode);

    let startOffset = 0;
    let endOffset = textNode.length;

    if (textNode === range.startContainer) startOffset = range.startOffset;
    if (textNode === range.endContainer) endOffset = range.endOffset;
    if (startOffset >= endOffset) continue;

    let selected = textNode;

    if (endOffset < selected.length) {
      selected.splitText(endOffset);
    }
    if (startOffset > 0) {
      selected = selected.splitText(startOffset);
    }

    const outerTag = findClosestTag(selected, tagName);
    if (!outerTag) continue;

    const outerParent = outerTag.parentNode;
    const selectedChild = getChildOfAncestor(selected, outerTag);

    // Step 1: create left and right <tagName> clones
    const beforeTag = outerTag.cloneNode(false);
    const afterTag = outerTag.cloneNode(false);

    let state = 'before';
    for (const child of [...outerTag.childNodes]) {
      if (child === selectedChild) {
        state = 'after';
        continue;
      }
      const clone = child.cloneNode(true);
      (state === 'before' ? beforeTag : afterTag).appendChild(clone);
    }

    // Step 2: split selectedChild if it is a wrapper (e.g. <em>)
    const selectedParts = splitWrapperForSelectedNode(selectedChild, selected);

    // Step 3: insert in order: beforeTag, unwrapped, afterTag
    const fragments = [];

    if (beforeTag.hasChildNodes()) fragments.push(beforeTag);
    fragments.push(...selectedParts.unwrapped);
    if (afterTag.hasChildNodes()) fragments.push(afterTag);

    // Merge adjacent same-tag fragments
    const merged = [];
    for (const frag of fragments) {
      const last = merged[merged.length - 1];
      if (
        last &&
        frag.tagName &&
        last.tagName === frag.tagName &&
        last.tagName === tagName
      ) {
        while (frag.firstChild) last.appendChild(frag.firstChild);
      } else {
        merged.push(frag);
      }
    }

    for (const el of merged) {
      outerParent.insertBefore(el, outerTag);
    }
    outerTag.remove();
  }

  normalizeRangeContainer(range);
}

function splitWrapperForSelectedNode(wrapper, selected) {
  if (wrapper === selected) {
    return {
      unwrapped: [document.createTextNode(selected.textContent)]
    };
  }

  const tagName = wrapper.tagName;
  const before = wrapper.cloneNode(false);
  const middle = wrapper.cloneNode(false);
  const after = wrapper.cloneNode(false);

  let state = 'before';
  for (const child of [...wrapper.childNodes]) {
    if (child === selected) {
      middle.appendChild(document.createTextNode(child.textContent));
      state = 'after';
      continue;
    }
    const clone = child.cloneNode(true);
    if (state === 'before') before.appendChild(clone);
    else after.appendChild(clone);
  }

  const output = [];

  if (before.hasChildNodes()) {
    const outer = wrapper.parentNode.cloneNode(false);
    outer.appendChild(before);
    output.push(outer);
  }

  output.push(middle);

  if (after.hasChildNodes()) {
    const outer = wrapper.parentNode.cloneNode(false);
    outer.appendChild(after);
    output.push(outer);
  }

  return {
    unwrapped: output
  };
}

function rewrapExcludingTag(node, tagToExclude) {
  const wrappers = [];

  let current = node.parentNode;
  tagToExclude = tagToExclude.toUpperCase();

  while (current && current.nodeType === 1) {
    if (current.tagName === tagToExclude) break;

    const clone = current.cloneNode(false); // shallow clone
    wrappers.push(clone);
    current = current.parentNode;
  }

  let inner = node;
  for (let i = wrappers.length - 1; i >= 0; i--) {
    wrappers[i].appendChild(inner);
    inner = wrappers[i];
  }

  return inner;
}

function collectTextNodes(range) {
  const nodes = new Set();

  if (
    range.startContainer === range.endContainer &&
    range.startContainer.nodeType === Node.TEXT_NODE
  ) {
    nodes.add(range.startContainer);
  } else {
    const walker = document.createTreeWalker(
      range.commonAncestorContainer,
      NodeFilter.SHOW_TEXT,
      {
        acceptNode(node) {
          return range.intersectsNode(node)
            ? NodeFilter.FILTER_ACCEPT
            : NodeFilter.FILTER_REJECT;
        },
      }
    );
    let node = walker.nextNode();
    while (node) {
      nodes.add(node);
      node = walker.nextNode();
    }
  }

  return nodes;
}

function isInsideTag(node, tagName) {
  let current = node.parentNode;
  tagName = tagName.toUpperCase();
  while (current) {
    if (current.tagName === tagName) return true;
    current = current.parentNode;
  }
  return false;
}

function findClosestTag(node, tagName) {
  let current = node.parentNode;
  tagName = tagName.toUpperCase();
  while (current) {
    if (current.tagName === tagName) return current;
    current = current.parentNode;
  }
  return null;
}

function normalizeRangeContainer(range) {
  let el = range.commonAncestorContainer;
  while (el && el.nodeType !== 1) {
    el = el.parentNode;
  }
  if (el) el.normalize();
}

function getChildOfAncestor(node, ancestor) {
  let current = node;
  while (current && current.parentNode !== ancestor) {
    current = current.parentNode;
  }
  return current;
}

function preserveSelectionByCharacterOffset(container, fn) {
  if (!container || container.nodeType !== 1 || !container.isConnected) return;

  const offsets = getCharacterOffsets(container);
  if (!offsets) {
    fn();
    return;
  }

  if (fn() === false) {
    // We were asked not to restore the selection
    return;
  }

  restoreSelectionFromOffsets(container, offsets.start, offsets.end);
}

function getCharacterOffsets(container) {
  const selection = window.getSelection();
  if (!selection.rangeCount) return null;

  const range = selection.getRangeAt(0);

  // Verify container fully contains selection
  if (!container.contains(range.startContainer) || !container.contains(range.endContainer)) {
    return null;
  }

  const startRange = document.createRange();
  startRange.setStart(container, 0);
  startRange.setEnd(range.startContainer, range.startOffset);
  const start = getRangeTextLength(startRange);

  const endRange = document.createRange();
  endRange.setStart(container, 0);
  endRange.setEnd(range.endContainer, range.endOffset);
  const end = getRangeTextLength(endRange);

  return { start, end };
}

function getRangeTextLength(range) {
  const walker = document.createTreeWalker(
    range.commonAncestorContainer,
    NodeFilter.SHOW_TEXT,
    {
      acceptNode: node =>
        range.intersectsNode(node) ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT
    }
  );

  let length = 0;
  let node;
  while ((node = walker.nextNode())) {
    const nodeRange = range.cloneRange();
    nodeRange.selectNodeContents(node);

    if (range.startContainer === node) {
      nodeRange.setStart(node, range.startOffset);
    }
    if (range.endContainer === node) {
      nodeRange.setEnd(node, range.endOffset);
    }

    length += nodeRange.toString().length;
  }

  return length;
}

function restoreSelectionFromOffsets(container, startOffset, endOffset) {
  const walker = document.createTreeWalker(container, NodeFilter.SHOW_TEXT);
  let currentOffset = 0;
  let startNode = null, endNode = null;
  let startNodeOffset = 0, endNodeOffset = 0;

  while (walker.nextNode()) {
    const node = walker.currentNode;
    const len = node.textContent.length;

    if (!startNode && currentOffset + len >= startOffset) {
      startNode = node;
      startNodeOffset = startOffset - currentOffset;
    }

    if (!endNode && currentOffset + len >= endOffset) {
      endNode = node;
      endNodeOffset = endOffset - currentOffset;
      break;
    }

    currentOffset += len;
  }

  if (startNode && endNode) {
    const range = document.createRange();
    range.setStart(startNode, startNodeOffset);
    range.setEnd(endNode, endNodeOffset);
    const sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
    // Fix caret if restored just before a zero-width space
    if (
      range.collapsed &&
      range.startContainer.nodeType === Node.TEXT_NODE &&
      range.startContainer.nodeValue === '\u200B' &&
      range.startOffset === 0
    ) {
      range.setStart(range.startContainer, 1);
      range.setEnd(range.startContainer, 1);
      sel.removeAllRanges();
      sel.addRange(range);
    }    
  }
}


function setSelection(sel, startC, startO, endC, endO, forward, adjustedOffset, collapsed) {
  const range = document.createRange();

  if (collapsed) {
    range.setStart(forward ? endC : startC, adjustedOffset);
    range.collapse(true);
  } else {
    if (forward) {
      range.setStart(startC, startO);
      range.setEnd(endC, adjustedOffset);
    } else {
      range.setStart(startC, adjustedOffset);
      range.setEnd(endC, endO);
    }
  }

  sel.removeAllRanges();
  sel.addRange(range);
  const range2 = sel.getRangeAt(0);
}

function codeAt(s, offset) {
  try {
    return s.charCodeAt(offset);
  } catch {
    return undefined;
  }
}

function skipZWS(direction) {
  const sel = window.getSelection();
  if (!sel || !sel.rangeCount) return;

  const range = sel.getRangeAt(0);
  if (!range.collapsed) return;

  const { startContainer, startOffset } = range;
  const target = (
    direction === 'forward'
      ? findTextNodeForward(startContainer, startOffset)
      : findTextNodeBackward(startContainer, startOffset)
  );
  console.log('target is:', target);

  if (
    target &&
    target.node.nodeValue &&
    (
      (direction === 'forward' && target.node.nodeValue[target.offset] === '\u200B') ||
      (direction === 'backward' && target.node.nodeValue[target.offset - 1] === '\u200B')
    )
  ) {
    const offset = direction === 'forward' ? target.offset + 1 : target.offset - 1;

    const newRange = document.createRange();
    newRange.setStart(target.node, offset);
    newRange.setEnd(target.node, offset);
    sel.removeAllRanges();
    sel.addRange(newRange);
  }
}

function findTextNodeForward(node, offset) {
  if (node.nodeType === Node.TEXT_NODE && offset < node.nodeValue.length) {
    return { node, offset };
  }

  const walker = document.createTreeWalker(
    document.body,
    NodeFilter.SHOW_TEXT,
    null,
    false
  );
  walker.currentNode = node;

  while (walker.nextNode()) {
    const n = walker.currentNode;
    if (n.nodeValue.length > 0) {
      return { node: n, offset: 0 };
    }
  }

  return null;
}

function findTextNodeBackward(node, offset) {
  if (node.nodeType === Node.TEXT_NODE && offset > 0) {
    return { node, offset };
  }

  const walker = document.createTreeWalker(
    document.body,
    NodeFilter.SHOW_TEXT,
    null,
    false
  );
  walker.currentNode = node;

  while (walker.previousNode()) {
    const n = walker.currentNode;
    const len = n.nodeValue.length;
    if (len > 0) {
      return { node: n, offset: len };
    }
  }

  return null;
}
